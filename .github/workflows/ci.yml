name: CI

on:
  push:
    branches: [main,version1]

  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run typecheck
        run: npm run typecheck
      
      - name: Run linter
        run: npm run lint
      
      - name: Run tests
        run: npm run test
      
      - name: Build
        run: npm run build
      
      - name: Run npm audit
        run: npm audit --audit-level=moderate

  extension-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install root deps
        run: npm ci
      
      - name: Install extension deps
        run: cd packages/vscode-extension && npm install
      
      - name: Build extension
        run: cd packages/vscode-extension && npm run build
      
      - name: Verify dist/extension.js exists
        run: test -f packages/vscode-extension/dist/extension.js
      
      - name: Package vsix
        run: cd packages/vscode-extension && npx vsce package --allow-missing-repository
      
      - name: Upload vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: memo-log-vscode.vsix
          path: packages/vscode-extension/*.vsix

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run security audit
        run: npm audit --audit-level=high
